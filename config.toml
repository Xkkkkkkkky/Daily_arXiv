[arxiv]
max_results_per_topic = 50
lookback_days = 2
timezone = "Asia/Shanghai"
sort_by = "submittedDate"
sort_order = "descending"
request_delay_seconds = 10.0
timeout_seconds = 90
retry_count = 2
retry_backoff_seconds = 10.0
allow_fetch_failure = true

# Focus on AI infrastructure, parallel/data systems, and astronomy technology.
[[topics]]
name = "Astronomical Instrumentation and Methods"
query = "cat:astro-ph.IM"

[[topics]]
name = "AI Infrastructure and Performance"
query = "(cat:cs.AR OR cat:cs.DC OR cat:cs.PF) AND (all:\"artificial intelligence\" OR all:\"machine learning\" OR all:\"large language model\" OR all:LLM OR all:GPU OR all:accelerator OR all:inference)"

[[topics]]
name = "Parallel and Distributed Computing"
query = "cat:cs.DC OR cat:cs.PF"

[[topics]]
name = "Big Data and Database Systems"
query = "cat:cs.DB OR (cat:cs.DC AND (all:\"big data\" OR all:\"data-intensive\" OR all:\"data processing\" OR all:\"data analytics\"))"

[ai]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
temperature = 0.2
max_tokens = 2000
language = "Simplified Chinese"
concurrency = 20

[digest]
priority_filter_enabled = true
priority_filter_min_total = 20
priority_filter_min_importance = 4
priority_filter_max_papers = 100

[email]
subject_prefix = "Daily arXiv"
from = ""
from_name = "Daily arXiv"
to = []
smtp_port = 465
smtp_use_tls = false
smtp_use_ssl = true
