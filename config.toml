[arxiv]
max_results_per_topic = 50
lookback_days = 2
timezone = "Asia/Shanghai"
sort_by = "submittedDate"
sort_order = "descending"
request_delay_seconds = 10.0
timeout_seconds = 90
retry_count = 2
retry_backoff_seconds = 10.0
allow_fetch_failure = true

# Add any number of top-level [[topics]] blocks.
[[topics]]
name = "Instrumentation and Methods for Astrophysics - ASTROPHYSICS"
query = "cat:astro-ph.IM"

#[[topics]]
#name = "Artificial Intelligence - Computer Science"
#query = "cat:cs.AI"

[[topics]]
name = "Distributed, Parallel, and Cluster Computing - Computer Science"
query = "cat:cs.DC"

[[topics]]
name = "Graphics - Computer Science"
query = "cat:cs.GR"

[[topics]]
name = "Multiagent Systems - Computer Science"
query = "cat:cs.MA"

[[topics]]
name = "Multimedia - Computer Science"
query = "cat:cs.MM"

[[topics]]
name = "Performance - Computer Science"
query = "cat:cs.PF"

[ai]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
temperature = 0.2
max_tokens = 2000
language = "Simplified Chinese"

[digest]
priority_filter_enabled = true
priority_filter_min_total = 20
priority_filter_min_importance = 4
priority_filter_max_papers = 100

[email]
subject_prefix = "Daily arXiv"
from = ""
from_name = "Daily arXiv"
to = []
smtp_port = 465
smtp_use_tls = false
smtp_use_ssl = true
